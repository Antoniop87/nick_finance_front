<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Nick Finance</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Nick Finance: controle suas despesas de forma simples.">
  <meta name="theme-color" content="#0f9f6e">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script>
    // Aplica o tema salvo antes da primeira pintura, evitando o "piscar" claro/escuro.
    try {
      var theme = localStorage.getItem('nick-finance.theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
